name: RELAX CSS cascade audit

on:
  push:
    branches:
      - analysis/css-cascade-audit-20260826
    paths:
      - .github/workflows/css-cascade-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout CSS only
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            style.css
            performance.css
            .github/workflows/css-cascade-audit.yml
          sparse-checkout-cone-mode: false

      - name: Analyze cascade duplication
        shell: bash
        run: |
          python3 - <<'PY'
          from collections import Counter, defaultdict
          from pathlib import Path
          import hashlib
          import re

          def matching_brace(text, open_pos):
              depth = 1
              i = open_pos + 1
              quote = None
              comment = False
              while i < len(text):
                  if comment:
                      if text.startswith('*/', i):
                          comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote:
                      if text[i] == '\\':
                          i += 2
                          continue
                      if text[i] == quote:
                          quote = None
                      i += 1
                      continue
                  if text.startswith('/*', i):
                      comment = True
                      i += 2
                      continue
                  if text[i] in ('"', "'"):
                      quote = text[i]
                      i += 1
                      continue
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise RuntimeError(f'Unbalanced CSS brace at {open_pos}')

          def clean_header(header):
              header = re.sub(r'/\*.*?\*/', ' ', header, flags=re.S)
              return re.sub(r'\s+', ' ', header).strip()

          def clean_body(body):
              body = re.sub(r'/\*.*?\*/', '', body, flags=re.S)
              body = re.sub(r'\s+', ' ', body).strip()
              return body

          def parse_rules(text):
              rules = []

              def walk(start, end, context=()):
                  pos = start
                  while pos < end:
                      while pos < end and text[pos].isspace():
                          pos += 1
                      if pos >= end:
                          break
                      if text.startswith('/*', pos):
                          close = text.find('*/', pos + 2)
                          if close < 0:
                              return
                          pos = close + 2
                          continue

                      open_pos = text.find('{', pos, end)
                      if open_pos < 0:
                          break
                      header = clean_header(text[pos:open_pos])
                      if not header:
                          pos = open_pos + 1
                          continue
                      close_pos = matching_brace(text, open_pos)
                      if close_pos > end:
                          break

                      line = text.count('\n', 0, pos) + 1
                      body = text[open_pos + 1:close_pos]

                      if header.startswith('@'):
                          at_name = header.split(None, 1)[0].lower()
                          if at_name in {'@media', '@supports', '@container', '@layer'}:
                              walk(open_pos + 1, close_pos, context + (header,))
                      else:
                          rules.append({
                              'selector': header,
                              'context': ' > '.join(context) or 'ROOT',
                              'line': line,
                              'body': clean_body(body),
                          })

                      pos = close_pos + 1

              walk(0, len(text))
              return rules

          for css_name in ('style.css', 'performance.css'):
              text = Path(css_name).read_text(encoding='utf-8')
              rules = parse_rules(text)
              print(f'=== {css_name} ===')
              print(f'bytes={len(text.encode("utf-8"))} lines={text.count(chr(10))+1} rules={len(rules)}')

              by_selector = defaultdict(list)
              by_context_selector = defaultdict(list)
              exact_body = defaultdict(list)

              for rule in rules:
                  by_selector[rule['selector']].append(rule)
                  by_context_selector[(rule['context'], rule['selector'])].append(rule)
                  digest = hashlib.sha1(rule['body'].encode()).hexdigest()
                  exact_body[(rule['selector'], digest)].append(rule)

              repeated = sorted(
                  ((selector, items) for selector, items in by_selector.items() if len(items) > 1),
                  key=lambda x: (-len(x[1]), x[0]),
              )
              print(f'repeated_selectors={len(repeated)}')
              for selector, items in repeated[:50]:
                  locs = ', '.join(f"{item['line']}[{item['context']}]" for item in items)
                  print(f'REPEAT x{len(items)} :: {selector} :: {locs}')

              same_context = sorted(
                  ((key, items) for key, items in by_context_selector.items() if len(items) > 1),
                  key=lambda x: (-len(x[1]), x[0][1]),
              )
              print(f'same_context_repeats={len(same_context)}')
              for (context, selector), items in same_context[:50]:
                  print(f'SAME_CONTEXT x{len(items)} :: {selector} :: lines={[i["line"] for i in items]} :: {context}')

              exact_dupes = [
                  (selector, items)
                  for (selector, _), items in exact_body.items()
                  if len(items) > 1 and items[0]['body']
                  for selector in [items[0]['selector']]
              ]
              exact_dupes.sort(key=lambda x: (-len(x[1]), x[0]))
              print(f'exact_duplicate_blocks={len(exact_dupes)}')
              for selector, items in exact_dupes[:50]:
                  print(f'EXACT_DUP x{len(items)} :: {selector} :: lines={[i["line"] for i in items]}')
              print()
          PY
