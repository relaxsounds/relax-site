name: Patch RELAX media lifecycle

on:
  push:
    branches:
      - perf/media-lifecycle-prefetch-20260826
    paths:
      - .github/workflows/patch-media-lifecycle.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            app.js
            index.html
            .github/scripts/patch_media_lifecycle.py
            .github/workflows/patch-media-lifecycle.yml
          sparse-checkout-cone-mode: false
      - run: python3 .github/scripts/patch_media_lifecycle.py
      - run: node --check app.js && grep -q 'app.js?v=9' index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "perf: preload selected media and release old video sources"
          git push origin HEAD:${GITHUB_REF_NAME}
