name: Optimize RELAX audio preserving sample rate

on:
  push:
    branches:
      - media/audio-192k-preserve-sr-20260826
    paths:
      - .github/workflows/optimize-audio-preserve-sr.yml

permissions:
  contents: write

jobs:
  optimize-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Sparse checkout audio only
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            assets/audio
            .github/workflows/optimize-audio-preserve-sr.yml
          sparse-checkout-cone-mode: false

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Optimize only MP3 above 192 kbps
        shell: bash
        run: |
          set -euo pipefail

          before=$(find assets/audio -type f -name '*.mp3' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          : > /tmp/changed-files.txt

          for file in assets/audio/*.mp3; do
            bitrate=$(ffprobe -v error -select_streams a:0 -show_entries stream=bit_rate -of default=nw=1:nk=1 "$file")
            sample_rate=$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=nw=1:nk=1 "$file")
            duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$file")
            old_size=$(stat -c%s "$file")

            echo "$file | bytes=$old_size | bitrate=$bitrate | sample_rate=$sample_rate | duration=$duration"

            if [ "${bitrate:-0}" -le 192000 ]; then
              echo "keep bitrate: $file"
              continue
            fi

            tmp="${file%.mp3}.optimized.mp3"

            ffmpeg -hide_banner -loglevel error -y \
              -i "$file" \
              -map_metadata -1 \
              -vn \
              -c:a libmp3lame \
              -b:a 192k \
              "$tmp"

            new_rate=$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=nw=1:nk=1 "$tmp")
            new_size=$(stat -c%s "$tmp")

            if [ "$new_rate" != "$sample_rate" ]; then
              echo "Sample rate changed unexpectedly for $file: $sample_rate -> $new_rate" >&2
              exit 1
            fi

            if [ "$new_size" -lt "$old_size" ]; then
              mv "$tmp" "$file"
              echo "$file" >> /tmp/changed-files.txt
              echo "optimized: $file | $old_size -> $new_size | ${sample_rate}Hz preserved"
            else
              rm -f "$tmp"
              echo "kept original: $file | $old_size <= $new_size"
            fi
          done

          after=$(find assets/audio -type f -name '*.mp3' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          saved=$((before - after))

          echo "before_bytes=$before" >> "$GITHUB_ENV"
          echo "after_bytes=$after" >> "$GITHUB_ENV"
          echo "saved_bytes=$saved" >> "$GITHUB_ENV"
          echo "Audio bytes: $before -> $after (saved $saved)"
          echo 'Changed files:'
          cat /tmp/changed-files.txt

      - name: Decode-validate all MP3 files
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/audio/*.mp3; do
            ffmpeg -v error -i "$file" -f null - </dev/null
          done

      - name: Commit optimized files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/*.mp3

          if git diff --cached --quiet; then
            echo 'No safe audio reductions produced.'
            exit 0
          fi

          git commit -m "media: optimize 256k ambience MP3s to 192k"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Report reduction
        run: |
          echo "Before: ${before_bytes} bytes"
          echo "After:  ${after_bytes} bytes"
          echo "Saved:  ${saved_bytes} bytes"
