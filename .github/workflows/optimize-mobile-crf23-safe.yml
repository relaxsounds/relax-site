name: Optimize RELAX mobile video safely

on:
  push:
    branches:
      - media/mobile-crf23-safe-20260826
    paths:
      - .github/workflows/optimize-mobile-crf23-safe.yml

permissions:
  contents: write

jobs:
  optimize-mobile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout mobile videos
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            assets/video/mobile
            .github/workflows/optimize-mobile-crf23-safe.yml
          sparse-checkout-cone-mode: false

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Re-encode only heavy mobile clips
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/changed-mobile.txt
          before=$(find assets/video/mobile -type f -name '*.mp4' -printf '%s\n' | awk '{s+=$1} END {print s+0}')

          for name in city-traffic forest-wind rain-heavy; do
            file="assets/video/mobile/${name}.mp4"
            old_size=$(stat -c%s "$file")
            width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$file")
            height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$file")
            fps=$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of default=nw=1:nk=1 "$file")
            tmp="${file%.mp4}.crf23.mp4"

            ffmpeg -hide_banner -loglevel error -y \
              -i "$file" \
              -map 0:v:0 -an \
              -c:v libx264 -preset medium -crf 23 \
              -pix_fmt yuv420p -movflags +faststart \
              "$tmp"

            new_size=$(stat -c%s "$tmp")
            new_width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$tmp")
            new_height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$tmp")
            new_fps=$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of default=nw=1:nk=1 "$tmp")

            if [ "$new_width" != "$width" ] || [ "$new_height" != "$height" ] || [ "$new_fps" != "$fps" ]; then
              echo "Geometry/FPS changed for $file" >&2
              exit 1
            fi

            max_size=$((old_size * 85 / 100))
            if [ "$new_size" -ge "$max_size" ]; then
              echo "keep original: $file | $old_size -> $new_size (<15% saving)"
              rm -f "$tmp"
              continue
            fi

            ssim_log="/tmp/${name}.ssim.log"
            ffmpeg -hide_banner -loglevel info \
              -i "$file" -i "$tmp" \
              -lavfi "[0:v][1:v]ssim" \
              -f null - 2> "$ssim_log"
            ssim=$(grep -oE 'All:[0-9.]+' "$ssim_log" | tail -1 | cut -d: -f2)

            python3 - "$ssim" <<'PY'
          import sys
          value = float(sys.argv[1])
          if value < 0.97:
              raise SystemExit(f'SSIM too low: {value}')
          PY

            mv "$tmp" "$file"
            echo "$file" >> /tmp/changed-mobile.txt
            echo "optimized: $file | $old_size -> $new_size | SSIM=$ssim"
          done

          after=$(find assets/video/mobile -type f -name '*.mp4' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          echo "before_bytes=$before" >> "$GITHUB_ENV"
          echo "after_bytes=$after" >> "$GITHUB_ENV"
          echo "saved_bytes=$((before-after))" >> "$GITHUB_ENV"
          cat /tmp/changed-mobile.txt

      - name: Full decode validation
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/video/mobile/*.mp4; do
            ffmpeg -v error -i "$file" -f null - </dev/null
          done

      - name: Commit accepted reductions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video/mobile/*.mp4
          if git diff --cached --quiet; then
            echo 'No mobile clip met the safety/savings thresholds.'
            exit 0
          fi
          git commit -m "media: safely reduce heavy mobile videos"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Report reduction
        run: |
          echo "Before: ${before_bytes} bytes"
          echo "After:  ${after_bytes} bytes"
          echo "Saved:  ${saved_bytes} bytes"
