name: Optimize RELAX desktop video safely

on:
  push:
    branches:
      - media/video-crf22-safe-20260826
    paths:
      - .github/workflows/optimize-video-crf22-safe.yml

permissions:
  contents: write

jobs:
  optimize-video:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Sparse checkout desktop videos
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            assets/video/optimized
            .github/workflows/optimize-video-crf22-safe.yml
          sparse-checkout-cone-mode: false

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Re-encode only overbitrate clips
        shell: bash
        run: |
          set -euo pipefail

          before=$(find assets/video/optimized -type f -name '*.mp4' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          : > /tmp/changed-video.txt

          for file in assets/video/optimized/*.mp4; do
            bitrate=$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of default=nw=1:nk=1 "$file")
            width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$file")
            height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$file")
            fps=$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of default=nw=1:nk=1 "$file")
            old_size=$(stat -c%s "$file")

            if [ "${bitrate:-0}" -lt 4000000 ]; then
              echo "keep bitrate: $file | bitrate=$bitrate | bytes=$old_size"
              continue
            fi

            tmp="${file%.mp4}.crf22.mp4"

            ffmpeg -hide_banner -loglevel error -y \
              -i "$file" \
              -map 0:v:0 \
              -an \
              -c:v libx264 \
              -preset medium \
              -crf 22 \
              -pix_fmt yuv420p \
              -movflags +faststart \
              "$tmp"

            new_width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$tmp")
            new_height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$tmp")
            new_fps=$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of default=nw=1:nk=1 "$tmp")
            new_size=$(stat -c%s "$tmp")

            if [ "$new_width" != "$width" ] || [ "$new_height" != "$height" ] || [ "$new_fps" != "$fps" ]; then
              echo "Geometry/FPS changed unexpectedly for $file: ${width}x${height} $fps -> ${new_width}x${new_height} $new_fps" >&2
              exit 1
            fi

            # Require at least 15% real savings; otherwise keep the original generation.
            max_size=$((old_size * 85 / 100))
            if [ "$new_size" -ge "$max_size" ]; then
              rm -f "$tmp"
              echo "keep original: $file | $old_size -> $new_size (<15% saving)"
              continue
            fi

            # Structural similarity guardrail. CRF22 should remain comfortably above this.
            ssim_log="/tmp/$(basename "$file").ssim.log"
            ffmpeg -hide_banner -loglevel info \
              -i "$file" -i "$tmp" \
              -lavfi "[0:v][1:v]ssim" \
              -f null - 2> "$ssim_log"
            ssim=$(grep -oE 'All:[0-9.]+' "$ssim_log" | tail -1 | cut -d: -f2)

            if [ -z "$ssim" ]; then
              echo "Could not calculate SSIM for $file" >&2
              exit 1
            fi

            python3 - "$ssim" <<'PY'
          import sys
          value = float(sys.argv[1])
          if value < 0.96:
              raise SystemExit(f'SSIM too low: {value}')
          PY

            mv "$tmp" "$file"
            echo "$file" >> /tmp/changed-video.txt
            echo "optimized: $file | $old_size -> $new_size | bitrate=$bitrate | SSIM=$ssim"
          done

          after=$(find assets/video/optimized -type f -name '*.mp4' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          saved=$((before - after))
          echo "before_bytes=$before" >> "$GITHUB_ENV"
          echo "after_bytes=$after" >> "$GITHUB_ENV"
          echo "saved_bytes=$saved" >> "$GITHUB_ENV"
          echo "Desktop video bytes: $before -> $after (saved $saved)"
          echo 'Changed files:'
          cat /tmp/changed-video.txt

      - name: Full decode validation
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/video/optimized/*.mp4; do
            ffmpeg -v error -i "$file" -f null - </dev/null
          done

      - name: Commit safe reductions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video/optimized/*.mp4

          if git diff --cached --quiet; then
            echo 'No desktop video met the safety/savings thresholds.'
            exit 0
          fi

          git commit -m "media: optimize overbitrate desktop ambience videos"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Report reduction
        run: |
          echo "Before: ${before_bytes} bytes"
          echo "After:  ${after_bytes} bytes"
          echo "Saved:  ${saved_bytes} bytes"
