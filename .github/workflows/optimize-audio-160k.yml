name: Optimize RELAX audio 160k

on:
  push:
    branches:
      - media/audio-160k-20260826
    paths:
      - .github/workflows/optimize-audio-160k.yml

permissions:
  contents: write

jobs:
  optimize-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Re-encode MP3 ambience at 160 kbps
        shell: bash
        run: |
          set -euo pipefail
          before=$(find assets/audio -type f -name '*.mp3' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          changed=0

          while IFS= read -r -d '' file; do
            tmp="${file%.mp3}.optimized.mp3"
            ffmpeg -hide_banner -loglevel error -y \
              -i "$file" \
              -map_metadata -1 \
              -vn \
              -c:a libmp3lame \
              -b:a 160k \
              -ar 44100 \
              "$tmp"

            old_size=$(stat -c%s "$file")
            new_size=$(stat -c%s "$tmp")

            if [ "$new_size" -lt "$old_size" ]; then
              mv "$tmp" "$file"
              changed=$((changed + 1))
            else
              rm -f "$tmp"
            fi
          done < <(find assets/audio -type f -name '*.mp3' -print0)

          after=$(find assets/audio -type f -name '*.mp3' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          echo "changed_files=$changed" >> "$GITHUB_ENV"
          echo "before_bytes=$before" >> "$GITHUB_ENV"
          echo "after_bytes=$after" >> "$GITHUB_ENV"
          echo "Audio bytes: $before -> $after across $changed changed files"

      - name: Commit optimized audio back to experiment branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/*.mp3

          if git diff --cached --quiet; then
            echo "No smaller MP3 outputs produced."
            exit 0
          fi

          git commit -m "media: optimize ambience MP3 files to 160 kbps"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Report reduction
        run: |
          echo "Changed MP3 files: ${changed_files}"
          echo "Before: ${before_bytes} bytes"
          echo "After:  ${after_bytes} bytes"
