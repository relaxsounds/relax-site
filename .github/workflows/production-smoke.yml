name: RELAX production smoke test

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: relax-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE: https://relaxsounds.github.io/relax-site
    steps:
      - name: Wait for this commit to reach production
        shell: bash
        run: |
          set -euo pipefail

          source_index='/tmp/source-index.html'
          prod_index='/tmp/prod-index.html'
          source_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/index.html"

          curl -fsSL --retry 3 "$source_url" -o "$source_index"
          source_hash=$(sha256sum "$source_index" | awk '{print $1}')

          ready=0
          for attempt in $(seq 1 48); do
            if curl -fsSL --connect-timeout 10 --max-time 30 \
              "${BASE}/?smoke=${GITHUB_SHA}-${attempt}" \
              -o "$prod_index"; then
              prod_hash=$(sha256sum "$prod_index" | awk '{print $1}')
              if [ "$prod_hash" = "$source_hash" ]; then
                ready=1
                echo "Production matches commit ${GITHUB_SHA}."
                break
              fi
            fi

            echo "Production has not reached ${GITHUB_SHA} yet (attempt ${attempt})."
            sleep 10
          done

          if [ "$ready" -ne 1 ]; then
            echo "Production never matched commit ${GITHUB_SHA}." >&2
            exit 1
          fi

          cp "$prod_index" /tmp/relax-index.html

      - name: Verify published HTML and canonical host
        shell: bash
        run: |
          set -euo pipefail
          index='/tmp/relax-index.html'

          grep -q 'https://relaxsounds.github.io/relax-site/' "$index"
          grep -q 'app.js?v=' "$index"
          grep -q 'performance.js?v=' "$index"
          grep -q 'performance.css?v=' "$index"

          if grep -q 'dmitrijsirsov88398-svg.github.io' "$index"; then
            echo 'Stale GitHub Pages hostname detected in production HTML.' >&2
            exit 1
          fi

      - name: Verify deployed text assets match this commit
        shell: bash
        run: |
          set -euo pipefail

          for path in \
            'app.js' \
            'performance.js' \
            'performance.css' \
            'robots.txt' \
            'sitemap.xml' \
            'rain/index.html' \
            'city/index.html' \
            'forest/index.html' \
            'ocean/index.html'
          do
            echo "Comparing ${path}"
            safe=$(echo "$path" | tr '/' '_')

            curl -fsSL --retry 3 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${path}" \
              -o "/tmp/source-${safe}"

            curl -fsSL --retry 3 \
              "${BASE}/${path}" \
              -o "/tmp/prod-${safe}"

            cmp "/tmp/source-${safe}" "/tmp/prod-${safe}"
          done

      - name: Verify SEO contract
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'Sitemap: https://relaxsounds.github.io/relax-site/sitemap.xml' /tmp/prod-robots.txt
          grep -q '<loc>https://relaxsounds.github.io/relax-site/</loc>' /tmp/prod-sitemap.xml
          grep -q '<loc>https://relaxsounds.github.io/relax-site/rain/</loc>' /tmp/prod-sitemap.xml
          grep -q '<loc>https://relaxsounds.github.io/relax-site/city/</loc>' /tmp/prod-sitemap.xml
          grep -q '<loc>https://relaxsounds.github.io/relax-site/forest/</loc>' /tmp/prod-sitemap.xml
          grep -q '<loc>https://relaxsounds.github.io/relax-site/ocean/</loc>' /tmp/prod-sitemap.xml

      - name: Verify representative media is streamable
        shell: bash
        run: |
          set -euo pipefail

          for path in \
            'assets/video/mobile/rain-thunder.mp4' \
            'assets/video/optimized/rain-heavy.mp4' \
            'assets/audio/city-traffic-loop2.wav' \
            'assets/audio/forest-birds.mp3'
          do
            echo "Range-checking ${path}"
            curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 \
              --range 0-1023 \
              "${BASE}/${path}" \
              -o /dev/null
          done
