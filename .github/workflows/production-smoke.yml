name: RELAX production smoke test

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: relax-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://relaxsounds.github.io/relax-site
    steps:
      - name: Wait for GitHub Pages deployment for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ready=0
          for attempt in $(seq 1 72); do
            json=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=dynamic&per_page=20")

            state=$(printf '%s' "$json" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          runs = [r for r in data.get("workflow_runs", []) if r.get("name") == "pages build and deployment"]
          if not runs:
              print("missing")
          else:
              run = runs[0]
              status = run.get("status") or "unknown"
              conclusion = run.get("conclusion") or ""
              print(f"{status}:{conclusion}")
          ')

            echo "Pages state for ${GITHUB_SHA}: ${state}"

            case "$state" in
              completed:success)
                ready=1
                break
                ;;
              completed:*)
                echo "GitHub Pages failed for ${GITHUB_SHA}: ${state}" >&2
                exit 1
                ;;
            esac

            sleep 10
          done

          if [ "$ready" -ne 1 ]; then
            echo "Timed out waiting for GitHub Pages deployment of ${GITHUB_SHA}." >&2
            exit 1
          fi

      - name: Wait for CDN text assets to match this commit
        shell: bash
        run: |
          set -euo pipefail

          paths=(
            'index.html'
            'app.js'
            'performance.js'
            'performance.css'
            'robots.txt'
            'sitemap.xml'
            'rain/index.html'
            'city/index.html'
            'forest/index.html'
            'ocean/index.html'
          )

          for path in "${paths[@]}"; do
            safe=$(echo "$path" | tr '/' '_')
            curl -fsSL --retry 3 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${path}" \
              -o "/tmp/source-${safe}"
          done

          ready=0
          for attempt in $(seq 1 36); do
            mismatch=0

            for path in "${paths[@]}"; do
              safe=$(echo "$path" | tr '/' '_')

              if ! curl -fsSL --connect-timeout 10 --max-time 30 \
                "${BASE}/${path}?smoke=${GITHUB_SHA}-${attempt}" \
                -o "/tmp/prod-${safe}"; then
                mismatch=1
                break
              fi

              if ! cmp -s "/tmp/source-${safe}" "/tmp/prod-${safe}"; then
                echo "CDN not current yet: ${path}"
                mismatch=1
                break
              fi
            done

            if [ "$mismatch" -eq 0 ]; then
              ready=1
              echo "Production text assets match ${GITHUB_SHA}."
              break
            fi

            sleep 10
          done

          if [ "$ready" -ne 1 ]; then
            echo "CDN text assets never converged to ${GITHUB_SHA}." >&2
            exit 1
          fi

      - name: Verify published HTML and canonical host
        shell: bash
        run: |
          set -euo pipefail
          index='/tmp/prod-index.html'

          grep -q 'https://relaxsounds.github.io/relax-site/' "$index"
          grep -q 'app.js?v=' "$index"
          grep -q 'performance.js?v=' "$index"
          grep -q 'performance.css?v=' "$index"

          if grep -q 'dmitrijsirsov88398-svg.github.io' "$index"; then
            echo 'Stale GitHub Pages hostname detected in production HTML.' >&2
            exit 1
          fi

      - name: Verify SEO contract
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'Sitemap: https://relaxsounds.github.io/relax-site/sitemap.xml' /tmp/prod-robots.txt
          grep -q '<loc>https://relaxsounds.github.io/relax-site/</loc>' /tmp/prod-sitemap.xml
          grep -q '<loc>https://relaxsounds.github.io/relax-site/rain/</loc>' /tmp/prod-sitemap.xml
          grep -q '<loc>https://relaxsounds.github.io/relax-site/city/</loc>' /tmp/prod-sitemap.xml
          grep -q '<loc>https://relaxsounds.github.io/relax-site/forest/</loc>' /tmp/prod-sitemap.xml
          grep -q '<loc>https://relaxsounds.github.io/relax-site/ocean/</loc>' /tmp/prod-sitemap.xml

      - name: Verify representative media is streamable
        shell: bash
        run: |
          set -euo pipefail

          for path in \
            'assets/video/posters/rain-heavy.webp' \
            'assets/video/mobile/rain-thunder.mp4' \
            'assets/video/optimized/rain-heavy.mp4' \
            'assets/audio/city-traffic-loop2.mp3' \
            'assets/audio/mixkit-rain-in-the-jungle-and-birds-2431.mp3' \
            'assets/audio/forest-birds.mp3'
          do
            echo "Range-checking ${path}"
            curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 \
              --range 0-1023 \
              "${BASE}/${path}" \
              -o /dev/null
          done
