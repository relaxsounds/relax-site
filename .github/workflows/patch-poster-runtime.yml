name: Patch RELAX poster runtime details

on:
  push:
    branches:
      - perf/poster-first-load-20260826
    paths:
      - .github/workflows/patch-poster-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            app.js
            .github/workflows/patch-poster-runtime.yml
          sparse-checkout-cone-mode: false

      - name: Tighten paused media lifecycle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''            /* Реальный ранний preload выбранной сцены. */\n            prepareVideoSource(\n                nextVideo,\n                scene.video\n            );''',
              '''            /* Видео заранее грузим только во время воспроизведения.\n             * На паузе click переключит лишь лёгкий WebP-постер. */\n            if (playing) {\n                prepareVideoSource(\n                    nextVideo,\n                    scene.video\n                );\n            }''',
              'pointerdown gate',
          )

          replace_once(
              '''            currentVideo.pause();\n\n            await stopCurrentAudio();''',
              '''            /* При паузе освобождаем видеопоток. Poster остаётся\n             * на элементе и мгновенно держит текущий фон. */\n            releaseVideoSource(\n                currentVideo\n            );\n\n            await stopCurrentAudio();''',
              'pause release',
          )

          old_loader = '''const loadingVideo =\n    document.querySelector(\"#videoA\");\n\n\nlet loadingFinished = false;'''
          replace_once(
              old_loader,
              '''let loadingFinished = false;''',
              'loading video declaration',
          )

          obsolete = '''\n\n/*\n * Ждём, пока первое видео сможет\n * нормально начать воспроизведение.\n */\n\nfunction checkInitialVideo() {\n\n    if (\n        loadingVideo.readyState >= 3\n    ) {\n\n        finishLoading();\n\n    }\n\n}\n\n\n/*\n * Основной вариант\n */\n\nloadingVideo.addEventListener(\n    \"canplay\",\n    finishLoading,\n    { once: true }\n);\n\n\n/*\n * Если браузер уже успел загрузить видео\n */\n\ncheckInitialVideo();\n'''
          replace_once(obsolete, '\n', 'obsolete video loader')

          path.write_text(text, encoding='utf-8')
          PY

          node --check app.js
          grep -q 'if (playing)' app.js
          ! grep -q 'checkInitialVideo' app.js

      - name: Commit runtime refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "perf: keep paused scenes poster-only"
          git push origin HEAD:${GITHUB_REF_NAME}
