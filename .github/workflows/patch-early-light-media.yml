name: Patch early light media selection

on:
  push:
    branches:
      - perf/early-light-media-20260826
    paths:
      - .github/workflows/patch-early-light-media.yml

permissions:
  contents: write

jobs:
  patch-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Patch app.js safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''function isMobilePerformanceMode() {\n    return MOBILE_VIDEO_MEDIA.matches;\n}''',
                  '''function isMobilePerformanceMode() {\n    const connection =\n        navigator.connection ||\n        navigator.mozConnection ||\n        navigator.webkitConnection ||\n        null;\n\n    const effectiveType =\n        String(connection?.effectiveType || "");\n\n    const memory =\n        Number(navigator.deviceMemory || 0);\n\n    const cores =\n        Number(navigator.hardwareConcurrency || 0);\n\n    return Boolean(\n        MOBILE_VIDEO_MEDIA.matches ||\n        window.matchMedia("(max-width: 1100px)").matches ||\n        window.matchMedia("(prefers-reduced-motion: reduce)").matches ||\n        connection?.saveData ||\n        effectiveType === "slow-2g" ||\n        effectiveType === "2g" ||\n        effectiveType === "3g" ||\n        (memory > 0 && memory <= 4) ||\n        (cores > 0 && cores <= 4)\n    );\n}'''
              ),
              (
                  '    audio.preload = "auto";',
                  '    audio.preload =\n        isMobilePerformanceMode()\n            ? "metadata"\n            : "auto";'
              ),
              (
                  '}, 8000);',
                  '}, 1800);'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "perf: choose lightweight media before initial load"
          git push origin HEAD:${GITHUB_REF_NAME}
