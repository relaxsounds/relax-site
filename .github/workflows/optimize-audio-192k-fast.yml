name: Optimize RELAX audio 192k fast

on:
  push:
    branches:
      - media/audio-192k-fast-20260826
    paths:
      - .github/workflows/optimize-audio-192k-fast.yml

permissions:
  contents: write

jobs:
  optimize-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Sparse checkout audio only
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            assets/audio
            .github/workflows/optimize-audio-192k-fast.yml
          sparse-checkout-cone-mode: false

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Verify ffmpeg
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Report source audio
        shell: bash
        run: |
          set -euo pipefail
          echo 'Source MP3 inventory:'
          for file in assets/audio/*.mp3; do
            size=$(stat -c%s "$file")
            bitrate=$(ffprobe -v error -select_streams a:0 -show_entries stream=bit_rate -of default=nw=1:nk=1 "$file" || true)
            duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$file" || true)
            echo "$file | bytes=$size | bitrate=${bitrate:-unknown} | duration=${duration:-unknown}"
          done

      - name: Re-encode MP3 ambience at 192 kbps in parallel
        shell: bash
        run: |
          set -euo pipefail

          before=$(find assets/audio -type f -name '*.mp3' -printf '%s\n' | awk '{s+=$1} END {print s+0}')

          transcode_one() {
            file="$1"
            tmp="${file%.mp3}.optimized.mp3"

            ffmpeg -hide_banner -loglevel error -y \
              -i "$file" \
              -map_metadata -1 \
              -vn \
              -c:a libmp3lame \
              -b:a 192k \
              -ar 44100 \
              "$tmp"

            old_size=$(stat -c%s "$file")
            new_size=$(stat -c%s "$tmp")

            if [ "$new_size" -lt "$old_size" ]; then
              mv "$tmp" "$file"
              echo "optimized: $file | $old_size -> $new_size"
            else
              rm -f "$tmp"
              echo "kept original: $file | $old_size <= $new_size"
            fi
          }
          export -f transcode_one

          find assets/audio -type f -name '*.mp3' -print0 \
            | xargs -0 -r -n1 -P2 bash -c 'transcode_one "$1"' _

          after=$(find assets/audio -type f -name '*.mp3' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          saved=$((before - after))

          echo "before_bytes=$before" >> "$GITHUB_ENV"
          echo "after_bytes=$after" >> "$GITHUB_ENV"
          echo "saved_bytes=$saved" >> "$GITHUB_ENV"
          echo "Audio bytes: $before -> $after (saved $saved)"

      - name: Validate every optimized MP3
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          for file in assets/audio/*.mp3; do
            if ! ffmpeg -v error -i "$file" -f null - </dev/null; then
              echo "Decode validation failed: $file" >&2
              failures=$((failures + 1))
            fi
          done
          test "$failures" -eq 0

      - name: Commit optimized audio to experiment branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/*.mp3

          if git diff --cached --quiet; then
            echo 'No smaller 192 kbps outputs produced.'
            exit 0
          fi

          git commit -m "media: optimize ambience MP3 files to 192 kbps"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Report reduction
        run: |
          echo "Before: ${before_bytes} bytes"
          echo "After:  ${after_bytes} bytes"
          echo "Saved:  ${saved_bytes} bytes"
